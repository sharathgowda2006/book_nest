        <rect x="2" y="14" width="4" height="44" rx="2" fill="#C59B27"/>
        <rect x="7" y="72" width="14" height="120" fill="url(#penBody)"/>
        <rect x="7" y="145" width="14" height="38" rx="2" fill="#0F172A" opacity="0.6"/>
        <polygon points="7,192 21,192 16,220 12,220" fill="#C59B27"/>
        <line x1="14" y1="220" x2="14" y2="228" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Pen 2 -->
      <g transform="translate(45, 0)">
        <rect x="6" y="0" width="16" height="72" rx="6" fill="#1E293B"/>
        <rect x="2" y="14" width="4" height="44" rx="2" fill="#C59B27"/>
        <rect x="7" y="72" width="14" height="120" fill="url(#penBody)"/>
        <rect x="7" y="145" width="14" height="38" rx="2" fill="#0F172A" opacity="0.6"/>
        <polygon points="7,192 21,192 16,220 12,220" fill="#C59B27"/>
        <line x1="14" y1="220" x2="14" y2="228" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Pen 3 -->
