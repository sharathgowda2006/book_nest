<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2EA"/>
      <stop offset="100%" stop-color="#EAE2D3"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1C2E"/>
      <stop offset="100%" stop-color="#4A0E1A"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#380913"/>
      <stop offset="50%" stop-color="#5E1422"/>
      <stop offset="100%" stop-color="#300710"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C675"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9A7414"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="14" dy="20" stdDeviation="16" flood-color="#141B2D" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="185" fill="#EFE8DA" opacity="0.7"/>
  <g filter="url(#shadow)" transform="translate(175, 48)">
    <!-- Page block right edge -->
    <path d="M242 10 L256 20 L256 348 L242 338 Z" fill="#FBF8F1" stroke="#D8CEBE" stroke-width="1"/>
    <line x1="246" y1="16" x2="246" y2="340" stroke="#E2D9C8" stroke-width="1"/>
    <line x1="251" y1="18" x2="251" y2="344" stroke="#E2D9C8" stroke-width="1"/>
    <!-- Book Spine -->
    <path d="M0 16 L24 0 L24 338 L0 354 Z" fill="url(#spine)"/>
    <!-- Front Cover -->
    <rect x="24" y="0" width="218" height="338" rx="3" fill="url(#cover)"/>
    <!-- Gold Foil Frame -->
    <rect x="38" y="14" width="190" height="310" rx="2" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.85"/>
    <rect x="43" y="19" width="180" height="300" rx="1" fill="none" stroke="url(#gold)" stroke-width="0.6" opacity="0.5"/>
    <!-- Top Edition Header -->
    <text x="133" y="44" text-anchor="middle" fill="#E6C675" font-family="Georgia, serif" font-size="9" letter-spacing="3">COMPUTER SCIENCE SERIES</text>
    <line x1="85" y1="53" x2="181" y2="53" stroke="url(#gold)" stroke-width="0.8"/>
    <!-- Geometric Algorithm Emblem -->
    <g transform="translate(133, 128)" stroke="url(#gold)" fill="none">
      <circle cx="0" cy="0" r="42" stroke-width="1.2" opacity="0.85"/>
      <polygon points="0,-36 31,18 -31,18" stroke-width="1.2" opacity="0.9"/>
      <polygon points="0,36 31,-18 -31,-18" stroke-width="1.2" opacity="0.65"/>
      <circle cx="0" cy="0" r="14" stroke-width="1.5"/>
      <circle cx="0" cy="-36" r="3.5" fill="#E6C675"/>
      <circle cx="31" cy="18" r="3.5" fill="#E6C675"/>
      <circle cx="-31" cy="18" r="3.5" fill="#E6C675"/>
    </g>
    <!-- Book Title -->
    <text x="133" y="212" text-anchor="middle" fill="#FAF7F2" font-family="Georgia, serif" font-size="21" font-weight="bold" letter-spacing="0.5">THE ART OF</text>
    <text x="133" y="238" text-anchor="middle" fill="#E6C675" font-family="Georgia, serif" font-size="20" font-weight="bold" letter-spacing="1">PROGRAMMING</text>
    <text x="133" y="260" text-anchor="middle" fill="#E5D5D8" font-family="sans-serif" font-size="9.5" letter-spacing="1.2">ALGORITHMS &amp; CLEAN DESIGN</text>
    <line x1="98" y1="276" x2="168" y2="276" stroke="url(#gold)" stroke-width="1"/>
    <!-- Author -->
    <text x="133" y="302" text-anchor="middle" fill="#FAF7F2" font-family="sans-serif" font-size="10" letter-spacing="2">DR. ARJUN MEHTA</text>
  </g>
</svg>
