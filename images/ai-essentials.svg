      <line x1="0" y1="0" x2="-24" y2="22"/>
      <line x1="0" y1="0" x2="24" y2="22"/>
      <line x1="-24" y1="22" x2="0" y2="32"/>
      <line x1="24" y1="22" x2="0" y2="32"/>
      <circle cx="0" cy="0" r="6" fill="#F2D580"/>
      <circle cx="0" cy="-30" r="4" fill="#FAF7F2"/>
      <circle cx="-26" cy="-18" r="4" fill="#F2D580"/>
      <circle cx="26" cy="-18" r="4" fill="#F2D580"/>
      <circle cx="-24" cy="22" r="4" fill="#FAF7F2"/>
      <circle cx="24" cy="22" r="4" fill="#FAF7F2"/>
