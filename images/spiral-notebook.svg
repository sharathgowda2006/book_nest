<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2EA"/>
      <stop offset="100%" stop-color="#EAE2D3"/>
    </linearGradient>
    <linearGradient id="nbCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1C2E"/>
      <stop offset="100%" stop-color="#52101D"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="12" dy="18" stdDeviation="15" flood-color="#141B2D" flood-opacity="0.20"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="185" fill="#EFE8DA" opacity="0.7"/>
  <g filter="url(#shadow)" transform="translate(175, 52)">
