<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F2EA"/>
      <stop offset="100%" stop-color="#EAE2D3"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="135%" height="135%">
      <feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#141B2D" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="185" fill="#EFE8DA" opacity="0.7"/>
  <g filter="url(#shadow)" transform="translate(142, 60)">
    <!-- Backing Kraft Folio -->
    <rect x="0" y="0" width="316" height="330" rx="14" fill="#232B3E" stroke="#C59B27" stroke-width="1.5"/>
    <text x="158" y="34" text-anchor="middle" fill="#F2D580" font-family="Georgia, serif" font-size="13" font-weight="bold" letter-spacing="2">STUDY STICKY NOTES &amp; TABS</text>
    <!-- Top Index Flags -->
    <rect x="24" y="54" width="52" height="22" rx="3" fill="#FDA4AF"/>
    <rect x="88" y="54" width="52" height="22" rx="3" fill="#FDE047"/>
    <rect x="152" y="54" width="52" height="22" rx="3" fill="#99F6E4"/>
    <rect x="216" y="54" width="76" height="22" rx="3" fill="#BAE6FD"/>
    <!-- Sticky Note Pad 1: Warm Gold Square -->
    <g transform="translate(24, 94)">
      <rect x="0" y="0" width="126" height="104" rx="4" fill="#FEF08A"/>
      <path d="M0 94 L116 94 L126 84 L126 104 L0 104 Z" fill="#FDE047"/>
      <line x1="16" y1="26" x2="110" y2="26" stroke="#CA8A04" stroke-width="1" opacity="0.35"/>
      <line x1="16" y1="48" x2="110" y2="48" stroke="#CA8A04" stroke-width="1" opacity="0.35"/>
      <line x1="16" y1="70" x2="86" y2="70" stroke="#CA8A04" stroke-width="1" opacity="0.35"/>
    </g>
    <!-- Sticky Note Pad 2: Rose Square -->
    <g transform="translate(166, 94)">
      <rect x="0" y="0" width="126" height="104" rx="4" fill="#FFE4E6"/>
      <line x1="16" y1="26" x2="110" y2="26" stroke="#BE123C" stroke-width="1" opacity="0.25"/>
      <line x1="16" y1="48" x2="110" y2="48" stroke="#BE123C" stroke-width="1" opacity="0.25"/>
      <line x1="16" y1="70" x2="86" y2="70" stroke="#BE123C" stroke-width="1" opacity="0.25"/>
    </g>
    <!-- Sticky Note Pad 3: Wide Grid Revision Pad -->
    <g transform="translate(24, 214)">
      <rect x="0" y="0" width="268" height="92" rx="4" fill="#FAF7F2"/>
      <text x="16" y="24" fill="#7A1C2E" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5">KEY LECTURE TAKEAWAYS</text>
      <line x1="16" y1="38" x2="252" y2="38" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="16" y1="56" x2="252" y2="56" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="16" y1="74" x2="200" y2="74" stroke="#CBD5E1" stroke-width="1"/>
    </g>
  </g>
</svg>
